name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MOCK_RAZORPAY: "true"
      ALLOW_TEST_WEBHOOK_BYPASS: "true"
      DATABASE_URL: sqlite:///./ci_recovery.db
      DASHBOARD_API_KEY: "ci-test-key"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -q
      - name: Compile Python sources
        run: python -m compileall -q agent api razorpay_client simulator *.py
